<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist · Casa Tonal</title>
<meta name="theme-color" content="#5C6B3A">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --oliva:#5C6B3A;--oliva-l:#7A8C4E;--seco:#A89F72;--seco-l:#C8BC8A;
  --crema:#F5F0E4;--crema-d:#EDE5D0;--cafe:#2E2A1E;--cafe-m:#4A4535;
  --blanco:#FDFBF6;
  --ok-bg:#E8F4E4;--ok:#4A7C3F;--ok-bd:#8FC48A;
  --low-bg:#FEF3CD;--low:#8B6914;--low-bd:#E6C84A;
  --out-bg:#FDEAEA;--out:#9B2B2B;--out-bd:#E88A8A;
}
body{font-family:'DM Sans',sans-serif;background:var(--crema);color:var(--cafe);min-height:100vh;max-width:430px;margin:0 auto}

/* HEADER */
.header{background:var(--oliva);padding:16px 18px;position:sticky;top:0;z-index:100}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:#FDFBF6}
.fecha-lbl{font-size:12px;color:rgba(253,251,246,0.7)}
.nav-tabs{display:flex;gap:8px}
.nav-tab{flex:1;padding:7px;border-radius:10px;border:1.5px solid rgba(253,251,246,0.2);background:transparent;color:rgba(253,251,246,0.6);font-size:13px;font-weight:500;cursor:pointer;text-align:center;font-family:'DM Sans',sans-serif;transition:all .15s}
.nav-tab.active{background:#FDFBF6;color:var(--oliva);border-color:#FDFBF6}

/* CONTENIDO */
.contenido{padding:14px}

/* TURNO */
.turno-tabs{display:flex;gap:8px;margin-bottom:14px}
.turno-tab{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--crema-d);background:var(--blanco);color:var(--cafe-m);font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;font-family:'DM Sans',sans-serif}
.turno-tab.mat{background:var(--oliva);border-color:var(--oliva);color:#FDFBF6}
.turno-tab.ves{background:var(--seco);border-color:var(--seco);color:var(--cafe)}

/* CHECKLIST ITEMS */
.section-lbl{font-size:11px;font-weight:500;color:var(--oliva-l);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 7px;display:flex;align-items:center;gap:6px}
.section-lbl::after{content:'';flex:1;height:1px;background:var(--seco-l);opacity:.5}
.item-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
.item-row:active{transform:scale(.98)}
.item-row.checked{background:var(--ok-bg);border-color:var(--ok-bd)}
.item-row.bloqueado{cursor:default;opacity:.7}
.check-box{width:24px;height:24px;border-radius:7px;border:2px solid var(--crema-d);background:var(--crema);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;color:transparent;transition:all .15s}
.item-row.checked .check-box{background:var(--oliva);border-color:var(--oliva);color:#FDFBF6}
.item-lbl{font-size:15px;color:var(--cafe);flex:1}
.item-row.checked .item-lbl{color:var(--ok)}

/* RESPONSABLE */
.resp-card{background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:12px;padding:12px 14px;margin-top:14px}
.resp-card label{font-size:11px;color:var(--seco);font-weight:500;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.resp-card select{width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--crema-d);background:var(--crema);color:var(--cafe);font-size:14px;font-family:'DM Sans',sans-serif}
.resp-card select:disabled{opacity:.6}

/* PROGRESO */
.prog-wrap{margin-top:10px}
.prog-bar{height:5px;background:var(--crema-d);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--oliva),var(--seco-l));border-radius:3px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--cafe-m);margin-top:5px}

/* BOTÓN ENVIAR */
.enviar-btn{width:100%;margin-top:16px;padding:14px;background:var(--oliva);color:#FDFBF6;border:none;border-radius:12px;font-size:16px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.enviar-btn:active{transform:scale(.98)}
.enviar-btn:disabled{opacity:.4;cursor:not-allowed}
.enviar-btn.enviado{background:var(--ok);cursor:default}

/* ESTADO ENVIADO */
.turno-enviado{background:var(--ok-bg);border:1.5px solid var(--ok-bd);border-radius:12px;padding:20px;text-align:center;margin-top:10px}
.turno-enviado .icon{font-size:36px;display:block;margin-bottom:8px}
.turno-enviado h3{font-size:16px;font-weight:500;color:var(--ok);margin-bottom:4px}
.turno-enviado p{font-size:13px;color:var(--cafe-m)}

/* INVENTARIO */
.resumen{display:flex;gap:6px;margin-bottom:12px}
.res-card{flex:1;border-radius:10px;padding:7px 6px;text-align:center;border:1.5px solid transparent}
.res-num{font-size:18px;font-weight:500}
.res-lbl{font-size:10px;margin-top:1px}
.res-ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.res-low{background:var(--low-bg);border-color:var(--low-bd);color:var(--low)}
.res-out{background:var(--out-bg);border-color:var(--out-bd);color:var(--out)}
.res-na{background:var(--crema-d);border-color:var(--seco-l);color:var(--cafe-m)}
.cat-tabs{display:flex;gap:8px;margin-bottom:12px}
.cat-tab{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--crema-d);background:var(--blanco);color:var(--cafe-m);font-size:14px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s;font-family:'DM Sans',sans-serif}
.cat-tab.active{background:var(--oliva);border-color:var(--oliva);color:#FDFBF6}
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;border:1.5px solid transparent}
.pill-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.pill-low{background:var(--low-bg);color:var(--low);border-color:var(--low-bd)}
.pill-out{background:var(--out-bg);color:var(--out);border-color:var(--out-bd)}
.pill-na{background:var(--crema-d);color:var(--cafe-m);border-color:var(--seco-l)}
.inv-card{background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:10px;margin-bottom:6px;overflow:hidden}
.inv-card.st-ok{border-color:var(--ok-bd)}
.inv-card.st-low{border-color:var(--low-bd)}
.inv-card.st-out{border-color:var(--out-bd)}
.inv-top{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer}
.inv-name{flex:1;font-size:14px;font-weight:500;color:var(--cafe)}
.st-badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.badge-none{background:var(--crema-d);color:var(--cafe-m)}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-low{background:var(--low-bg);color:var(--low)}
.badge-out{background:var(--out-bg);color:var(--out)}
.inv-detail{padding:0 14px 10px;display:none}
.inv-card.open .inv-detail{display:block}
.st-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.st-btn{font-size:12px;padding:4px 10px;border-radius:20px;border:1.5px solid transparent;cursor:pointer;font-weight:500;font-family:'DM Sans',sans-serif}
.sel-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.sel-low{background:var(--low-bg);color:var(--low);border-color:var(--low-bd)}
.sel-out{background:var(--out-bg);color:var(--out);border-color:var(--out-bd)}
.unsel{background:var(--crema-d);color:var(--cafe-m);border-color:var(--crema-d)}
.field-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.field-row label{font-size:12px;color:var(--seco);font-weight:500;min-width:70px}
.field-input{flex:1;padding:6px 10px;border-radius:8px;border:1.5px solid var(--crema-d);background:var(--crema);color:var(--cafe);font-size:13px;font-family:'DM Sans',sans-serif}
.field-input:focus{outline:none;border-color:var(--oliva)}
textarea.field-input{resize:none}
.add-btn{width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--seco-l);background:transparent;color:var(--seco);border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ADMIN MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(46,42,30,0.6);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--blanco);border-radius:16px;padding:28px 24px;width:100%;max-width:340px}
.modal-box h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--oliva);margin-bottom:4px}
.modal-box p{font-size:13px;color:var(--cafe-m);margin-bottom:20px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:12px;color:var(--seco);font-weight:500;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.modal-field input{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid var(--crema-d);background:var(--crema);color:var(--cafe);font-size:14px;font-family:'DM Sans',sans-serif}
.modal-field input:focus{outline:none;border-color:var(--oliva)}
.modal-btn{width:100%;padding:11px;background:var(--oliva);color:#FDFBF6;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
.modal-error{font-size:13px;color:var(--out);text-align:center;margin-top:8px;display:none}
.modal-cancel{width:100%;padding:9px;background:transparent;color:var(--cafe-m);border:1.5px solid var(--crema-d);border-radius:10px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px}
.logout-btn{font-size:11px;background:rgba(253,251,246,0.15);color:rgba(253,251,246,0.7);border:1px solid rgba(253,251,246,0.2);border-radius:20px;padding:3px 10px;cursor:pointer;font-family:'DM Sans',sans-serif}

/* ADMIN CALENDARIO */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:8px;color:var(--cafe);font-size:18px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-mes-lbl{font-family:'Playfair Display',serif;font-size:17px;color:var(--cafe)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dow span{text-align:center;font-size:10px;color:var(--seco);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.cal-dia{min-height:52px;border-radius:8px;border:1.5px solid var(--crema-d);background:var(--blanco);padding:5px;cursor:pointer;transition:all .15s}
.cal-dia:hover{border-color:var(--oliva-l)}
.cal-dia.vacio{background:transparent;border-color:transparent;cursor:default}
.cal-dia.hoy{border-color:var(--oliva)}
.cal-dia.sel{border-color:var(--oliva);background:var(--ok-bg)}
.cal-dia.con-datos{border-color:var(--ok-bd)}
.cal-dia-num{font-size:11px;font-weight:500;color:var(--cafe-m)}
.cal-dia.hoy .cal-dia-num{color:var(--oliva);font-weight:700}
.cal-dia.con-datos .cal-dia-num{color:var(--cafe)}
.cal-dia-cnt{font-size:10px;color:var(--ok);margin-top:2px}
.cal-detalle{background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:12px;padding:14px;margin-top:4px}
.cal-det-fecha{font-family:'Playfair Display',serif;font-size:16px;color:var(--cafe);margin-bottom:12px}
.cal-reporte-card{background:var(--crema);border:1.5px solid var(--crema-d);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.cal-reporte-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-reporte-quien{font-size:14px;font-weight:500;color:var(--cafe)}
.cal-reporte-turno{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.turno-m{background:var(--oliva);color:#FDFBF6}
.turno-v{background:var(--seco);color:var(--cafe)}
.cal-reporte-pct{font-size:20px;font-weight:500;color:var(--oliva)}
.cal-reporte-sub{font-size:11px;color:var(--cafe-m)}
.cal-items-wrap{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.cal-item-chip{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--crema-d);color:var(--cafe-m)}
.cal-item-chip.done{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.cal-empty{text-align:center;padding:30px;color:var(--seco);font-size:13px}

/* MISC */
.notif{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--cafe);color:#FDFBF6;padding:7px 18px;border-radius:50px;font-size:13px;z-index:300;display:none;white-space:nowrap;font-family:'DM Sans',sans-serif}
.notif.show{display:block;animation:fadeOut 2.5s ease forwards}
@keyframes fadeOut{0%{opacity:0;transform:translateX(-50%) translateY(-8px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
.footer-note{text-align:center;font-size:11px;color:var(--seco);margin-top:16px;opacity:.8;padding-bottom:20px}
.loading{text-align:center;padding:30px;color:var(--seco);font-size:14px}
</style>
</head>
<body>

<!-- MODAL LOGIN ADMIN -->
<div class="modal-overlay" id="modal-admin" style="display:none">
  <div class="modal-box">
    <h2>Acceso Admin</h2>
    <p>Solo para administradores de Casa Tonal</p>
    <div class="modal-field"><label>Usuario</label><input type="text" id="inp-user" placeholder="Usuario" autocomplete="username"/></div>
    <div class="modal-field"><label>Contraseña</label><input type="password" id="inp-pass" placeholder="Contraseña" onkeydown="if(event.key==='Enter')intentarLogin()"/></div>
    <button class="modal-btn" onclick="intentarLogin()">Entrar</button>
    <div class="modal-error" id="login-error">Usuario o contraseña incorrectos</div>
    <button class="modal-cancel" onclick="cerrarModalAdmin()">Cancelar</button>
  </div>
</div>

<div class="notif" id="notif"></div>

<header class="header">
  <div class="header-top">
    <span class="logo">Casa Tonal</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="fecha-lbl" id="fecha-hdr"></span>
      <button class="logout-btn" id="btn-logout" style="display:none" onclick="cerrarSesionAdmin()">Salir</button>
    </div>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="ntab-limpieza" onclick="setVista('limpieza',this)">☑ Limpieza</button>
    <button class="nav-tab" id="ntab-inventario" onclick="setVista('inventario',this)">📦 Inventario</button>
    <button class="nav-tab" id="ntab-admin" onclick="pedirAccesoAdmin(this)">📊 Admin</button>
  </div>
</header>

<div class="contenido">

  <!-- ===== VISTA LIMPIEZA ===== -->
  <div id="vista-limpieza">
    <div class="turno-tabs">
      <button class="turno-tab mat" id="tab-mat" onclick="setTurno('M')">☀️ Matutino</button>
      <button class="turno-tab" id="tab-ves" onclick="setTurno('V')">🌙 Vespertino</button>
    </div>
    <div id="checklist-body"></div>
    <div class="resp-card">
      <label>Tu nombre</label>
      <select id="resp-sel">
        <option value="">— Selecciona tu nombre —</option>
        <option>Ángeles</option><option>Abril</option><option>Elena</option>
        <option>Janeth</option><option>Rocío</option><option>Marcos</option><option>Serafín</option>
      </select>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="prog-txt" id="prog-txt"></div>
    </div>
    <button class="enviar-btn" id="btn-enviar" onclick="enviarTurno()">Enviar turno</button>
    <div class="footer-note">Casa Tonal · Amozoc, Puebla</div>
  </div>

  <!-- ===== VISTA INVENTARIO ===== -->
  <div id="vista-inventario" style="display:none">
    <div class="resumen" id="inv-resumen"></div>
    <div class="cat-tabs">
      <button class="cat-tab active" id="tab-beb" onclick="setCategoria('bebidas')">☕ Bebidas</button>
      <button class="cat-tab" id="tab-ali" onclick="setCategoria('alimentos')">🥐 Alimentos</button>
    </div>
    <input type="text" id="inv-search" placeholder="🔍 Buscar producto..." oninput="filtrarInventario(this.value)"
      style="width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--crema-d);background:var(--blanco);color:var(--cafe);font-size:14px;font-family:'DM Sans',sans-serif;margin-bottom:12px;outline:none"/>
    <div class="legend">
      <span class="pill pill-ok">✓ Suficiente</span>
      <span class="pill pill-low">⚠ Poco</span>
      <span class="pill pill-out">✕ Agotado</span>
      <span class="pill pill-na">— Sin revisar</span>
    </div>
    <div id="inv-body"></div>
    <div class="resp-card">
      <label>Revisado por</label>
      <select id="inv-resp">
        <option value="">— Selecciona tu nombre —</option>
        <option>Ángeles</option><option>Abril</option><option>Elena</option>
        <option>Janeth</option><option>Rocío</option><option>Marcos</option><option>Serafín</option>
      </select>
    </div>
    <button class="enviar-btn" id="btn-enviar-inv" onclick="enviarInventario()">Enviar inventario</button>
    <div class="footer-note">Casa Tonal · Amozoc, Puebla</div>
  </div>

  <!-- ===== VISTA ADMIN ===== -->
  <div id="vista-admin" style="display:none">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="cambiarMes(-1)">‹</button>
      <span class="cal-mes-lbl" id="cal-mes-lbl"></span>
      <button class="cal-nav-btn" onclick="cambiarMes(1)">›</button>
    </div>
    <div class="cal-dow"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-detalle" id="cal-detalle" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="cal-det-fecha" id="cal-det-fecha" style="margin-bottom:0"></div>
        <button onclick="descargarExcelDia()" style="background:var(--ok-bg);border:1.5px solid var(--ok-bd);color:var(--ok);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap">⬇ Excel</button>
      </div>
      <div id="cal-det-body"></div>
    </div>
    <div class="footer-note">Casa Tonal · Amozoc, Puebla</div>
  </div>

</div>

const ALL_ITEMS=[...INMUEBLES,...TRABAJO];
const CATALOGO={
  bebidas:{"Cafés y base":["Café Oscuro","Café Medio","Café Honey","Chocolate Líquido","Chocolate en Polvo"],"Leches":["Leche Entera","Leche Deslactosada","Leche Evaporada","Crema Batida"],"Saborizantes":["Vainilla","Caramelo","Canela","Calahua"],"Tés":["Té de Manzanilla con Hinojo y Aloe Vera","Té Negro de Frutos Rojos","Té Manzanilla y Lavanda","Té Verde Limón","Té Jengibre y Lima","Té Blanco y Menta"],"Siropes":["Sirope Frutos Rojos","Sirope Mora Azul","Sirope Cereza","Sirope Manzana Verde","Sirope Fresa – Kiwi","Sirope Mango","Sirope Maracuya Tropical","Concentrado de Jamaica"],"Toppings":["Nuez","Arándanos","Galleta Oreo","Chispas de Chocolate","Chispas de Vainilla","Chispas de Colores","Mazapán","Perlas explosivas de Frutos Rojos","Perlas explosivas de Manzana verde","Perlas explosivas de Mora Azul"],"Helados y hielo":["Helado de Vainilla","Hielo","Garrafón de Agua"],"Desechables":["Vasos café caliente 16 oz","Tapas café caliente 16 oz","Vasos café caliente 12 oz","Tapas café caliente 12 oz","Vasos café caliente 8 oz","Vasos frappé 16 oz","Tapas frappé 16 oz","Vasos frappé 12 oz","Tapas frappé 12 oz","Vasos frappé 8 oz","Tapas frappé 8 oz","Cartón para vaso","Popotes"]},
  alimentos:{"Panes y masas":["Cuernitos","Bolillos","Tortas","Pan para Sándwich","Harina","Huevo","Vainilla"],"Proteínas":["Jamón","Milanesa","Salchicha","Tocino"],"Quesos":["Queso Mozzarella","Queso Crema","Queso Amarillo","Quesillo"],"Verduras y frescos":["Lechuga","Jitomate","Cebolla","Cilantro","Aguacate","Serranito","Rajas","Chipotles","Papas Gajo"],"Salsas y aderezos":["Valentina","Catsup","Salsa Macha","Mermelada de Fresa","Mermelada de Zarzamora","Cajeta"],"Postres":["Pay de Limón","Flan Napolitano","Cheesecake Zarzamora"],"Desechables":["Papel Cuadrado","Bolsas de 2 orejas","Servilletas"],"Limpieza":["Papel para Baño","Limpiador con aroma","Jabón para Trastes","Esponja para Trastes","Guantes para Limpieza"]}
};

let vista='limpieza', turno='M', catInv='bebidas';
let checks={}, invCache={}, customProductos={};
let calAnio=new Date().getFullYear(), calMes=new Date().getMonth();
let calResumen={}, calDiaSel=null;

// ─── UTILS ───────────────────────────────────────────────────
function fechaHoy(){
  return new Date().toLocaleDateString('es-MX',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');
}
function notif(msg){ const n=document.getElementById('notif'); n.textContent=msg; n.classList.remove('show'); void n.offsetWidth; n.classList.add('show'); }
function esc(s){ return (s||'').replace(/'/g,"&#39;").replace(/"/g,'&quot;'); }
function escQ(s){ return (s||'').replace(/'/g,"\\'"); }

// ─── AUTH ADMIN ──────────────────────────────────────────────
function esAdmin(){ try{ return sessionStorage.getItem(SESSION_KEY)==='true'; }catch(e){ return false; } }
function pedirAccesoAdmin(btn){
  if(esAdmin()){ setVista('admin',btn); return; }
  document.getElementById('modal-admin').style.display='flex';
  document.getElementById('inp-user').value='';
  document.getElementById('inp-pass').value='';
  document.getElementById('login-error').style.display='none';
  setTimeout(()=>document.getElementById('inp-user').focus(),100);
}
function intentarLogin(){
  const u=document.getElementById('inp-user').value.trim();
  const p=document.getElementById('inp-pass').value;
  if(u===ADMIN_USER&&p===ADMIN_PASS){
    try{ sessionStorage.setItem(SESSION_KEY,'true'); }catch(e){}
    cerrarModalAdmin();
    document.getElementById('btn-logout').style.display='block';
    setVista('admin',document.getElementById('ntab-admin'));
  } else {
    document.getElementById('login-error').style.display='block';
    document.getElementById('inp-pass').value='';
  }
}
function cerrarModalAdmin(){ document.getElementById('modal-admin').style.display='none'; }
function cerrarSesionAdmin(){
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){}
  document.getElementById('btn-logout').style.display='none';
  document.getElementById('ntab-limpieza').click();
  notif('Sesión admin cerrada');
}
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('modal-admin').addEventListener('click',function(e){ if(e.target===this)cerrarModalAdmin(); });
  if(esAdmin()) document.getElementById('btn-logout').style.display='block';
});

// ─── NAVEGACIÓN ──────────────────────────────────────────────
function setVista(v,btn){
  vista=v;
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('vista-limpieza').style.display=v==='limpieza'?'block':'none';
  document.getElementById('vista-inventario').style.display=v==='inventario'?'block':'none';
  document.getElementById('vista-admin').style.display=v==='admin'?'block':'none';
  if(v==='admin') iniciarCalendario();
}

// ─── CHECKLIST ───────────────────────────────────────────────
function turnoKey(){ return `enviado__${fechaHoy()}__${turno}`; }
function yaEnviado(){ try{ return localStorage.getItem(turnoKey())==='1'; }catch(e){ return false; } }

function setTurno(t){
  turno=t;
  document.getElementById('tab-mat').className='turno-tab'+(t==='M'?' mat':'');
  document.getElementById('tab-ves').className='turno-tab'+(t==='V'?' ves':'');
  renderChecklist();
}

function toggleItem(item){
  if(yaEnviado()) return;
  const k=`${turno}__${item}`;
  checks[k]=!checks[k];
  renderChecklist();
}

function renderChecklist(){
  const body=document.getElementById('checklist-body');
  const enviado=yaEnviado();
  body.innerHTML='';

  if(enviado){
    body.innerHTML=`<div class="turno-enviado"><span class="icon">✅</span><h3>Turno enviado</h3><p>Ya enviaste el reporte de este turno.<br>¡Gracias por tu trabajo!</p></div>`;
    document.getElementById('resp-sel').disabled=true;
    document.getElementById('btn-enviar').disabled=true;
    document.getElementById('btn-enviar').textContent='✓ Turno enviado';
    document.getElementById('btn-enviar').classList.add('enviado');
    document.getElementById('prog-fill').style.width='100%';
    document.getElementById('prog-txt').textContent='Turno completado y enviado';
    return;
  }

  document.getElementById('resp-sel').disabled=false;
  document.getElementById('btn-enviar').disabled=false;
  document.getElementById('btn-enviar').textContent='Enviar turno';
  document.getElementById('btn-enviar').classList.remove('enviado');

  const makeSection=(lbl)=>{ const s=document.createElement('div'); s.className='section-lbl'; s.textContent=lbl; body.appendChild(s); };
  const makeItem=(item)=>{
    const k=`${turno}__${item}`;
    const checked=!!checks[k];
    const row=document.createElement('div');
    row.className='item-row'+(checked?' checked':'');
    row.innerHTML=`<div class="check-box">${checked?'✓':''}</div><span class="item-lbl">${item}</span>`;
    row.onclick=()=>toggleItem(item);
    body.appendChild(row);
  };
  makeSection('🏠 Limpieza inmuebles');
  INMUEBLES.forEach(makeItem);
  makeSection('⚙️ Área de trabajo');
  TRABAJO.forEach(makeItem);

  const done=ALL_ITEMS.filter(i=>checks[`${turno}__${i}`]).length;
  const pct=Math.round(done/ALL_ITEMS.length*100);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`${done} de ${ALL_ITEMS.length} completadas`;
}

async function enviarTurno(){
  const resp=document.getElementById('resp-sel').value;
  if(!resp){ notif('Selecciona tu nombre primero'); return; }
  const done=ALL_ITEMS.filter(i=>checks[`${turno}__${i}`]);
  const fecha=fechaHoy();
  const btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.textContent='Enviando...';
  try{
    // Insertar un registro por actividad
    const rows=ALL_ITEMS.map(item=>({
      fecha, turno, responsable:resp,
      actividad:item,
      completado:!!checks[`${turno}__${item}`],
      seccion:INMUEBLES.includes(item)?'inmuebles':'trabajo'
    }));
    const{error}=await sb.from('checklist_limpieza').upsert(rows,{onConflict:'fecha,turno,actividad'});
    if(error) throw error;
    // Marcar como enviado en localStorage
    try{ localStorage.setItem(turnoKey(),'1'); }catch(e){}
    notif('✅ Turno enviado correctamente');
    renderChecklist();
  } catch(e){
    notif('Error al enviar. Intenta de nuevo.');
    btn.disabled=false; btn.textContent='Enviar turno';
  }
}

// ─── INVENTARIO ──────────────────────────────────────────────
function invKey(tipo,prod){ return `${tipo}||${prod}`; }
function getInv(tipo,prod){ return invCache[invKey(tipo,prod)]||{status:'',qty:'',nota:''}; }

function setCategoria(c){
  catInv=c;
  invBusqueda='';
  const searchEl=document.getElementById('inv-search');
  if(searchEl) searchEl.value='';
  document.getElementById('tab-beb').className='cat-tab'+(c==='bebidas'?' active':'');
  document.getElementById('tab-ali').className='cat-tab'+(c==='alimentos'?' active':'');
  renderInv();
}

function setStatusInv(tipo,prod,st,cardId){
  invCache[invKey(tipo,prod)]={...getInv(tipo,prod),status:st};
  renderInv();
  setTimeout(()=>document.getElementById(cardId)?.classList.add('open'),10);
}

function renderInvBadge(st){
  if(st==='ok') return `<span class="st-badge badge-ok">✓ Suficiente</span>`;
  if(st==='low') return `<span class="st-badge badge-low">⚠ Poco</span>`;
  if(st==='out') return `<span class="st-badge badge-out">✕ Agotado</span>`;
  return `<span class="st-badge badge-none">— Revisar</span>`;
}

function makeInvCard(prod, tipo, idx){
  const d=getInv(tipo,prod);
  const id=`inv-${idx}`;
  const cls=d.status?`st-${d.status}`:'';
  const btns=['ok','low','out'].map(s=>{
    const labels={ok:'Suficiente',low:'Poco',out:'Agotado'};
    const c=d.status===s?`sel-${s}`:'unsel';
    return `<button class="st-btn ${c}" onclick="setStatusInv('${tipo}','${escQ(prod)}','${s}','${id}')">${labels[s]}</button>`;
  }).join('');
  return `<div class="inv-card ${cls}" id="${id}">
    <div class="inv-top" onclick="document.getElementById('${id}').classList.toggle('open')">
      <span class="inv-name">${prod}</span>${renderInvBadge(d.status)}
    </div>
    <div class="inv-detail">
      <div class="st-row">${btns}</div>
      <div class="field-row"><label>Cantidad</label><input class="field-input" type="text" placeholder="ej. 2 paquetes" value="${esc(d.qty)}" onchange="invCache[invKey('${tipo}','${escQ(prod)}')].qty=this.value"/></div>
      <div class="field-row"><label>Nota</label><textarea class="field-input" rows="2" placeholder="ej. pedir el martes..." onchange="invCache[invKey('${tipo}','${escQ(prod)}')].nota=this.value">${esc(d.nota)}</textarea></div>
    </div>
  </div>`;
}

let invBusqueda='';
function filtrarInventario(val){ invBusqueda=val.toLowerCase(); renderInv(); }

function renderInv(){
  const secs=CATALOGO[catInv], cx=customProductos[catInv]||[];
  const todosCustom=[...(customProductos['bebidas']||[]),...(customProductos['alimentos']||[])];
  // quitar duplicados con catálogo
  const cxFiltrados=cx.filter(p=>!Object.values(secs).flat().includes(p));

  let html=''; let idx=0;

  if(invBusqueda){
    // Modo búsqueda — mostrar todos los productos que coincidan
    const todosProd=[...Object.values(secs).flat(),...cxFiltrados];
    const encontrados=todosProd.filter(p=>p.toLowerCase().includes(invBusqueda));
    if(encontrados.length){
      html+=`<div class="section-lbl">Resultados</div>`;
      encontrados.forEach(prod=>{ html+=makeInvCard(prod,catInv,idx++); });
    } else {
      // No encontrado — botón para agregar
      html+=`<div style="padding:16px;background:var(--blanco);border:1.5px solid var(--crema-d);border-radius:10px;margin-bottom:8px">
        <div style="font-size:13px;color:var(--cafe-m);margin-bottom:10px">Sin resultados para "<b style="color:var(--cafe)">${invBusqueda}</b>"</div>
        <button onclick="addProductoInv()" style="width:100%;padding:9px;background:var(--ok-bg);border:1.5px solid var(--ok-bd);border-radius:8px;color:var(--ok);font-size:13px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif">
          + Agregar "${invBusqueda}" al inventario
        </button>
      </div>`;
    }
  } else {
    // Modo normal — secciones del catálogo
    for(const[sec,items]of Object.entries(secs)){
      html+=`<div class="section-lbl">${sec}</div>`;
      items.forEach(prod=>{ html+=makeInvCard(prod,catInv,idx++); });
    }
    if(cxFiltrados.length){
      html+=`<div class="section-lbl">Añadidos</div>`;
      cxFiltrados.forEach(prod=>{ html+=makeInvCard(prod,catInv,idx++); });
    }
  }

  document.getElementById('inv-body').innerHTML=html;
  renderResumen();
}

async function addProductoInv(){
  const nombre=invBusqueda.trim();
  if(!nombre) return;
  try{
    await sb.from('productos_custom').upsert({nombre,categoria:catInv,creado_por:'inventario'},{onConflict:'nombre'});
  }catch(e){ console.error(e); }
  if(!customProductos[catInv])customProductos[catInv]=[];
  if(!customProductos[catInv].includes(nombre)){
    customProductos[catInv].push(nombre);
  }
  invBusqueda='';
  const searchEl=document.getElementById('inv-search');
  if(searchEl) searchEl.value='';
  renderInv();
  notif(`✅ "${nombre}" añadido al inventario`);
}

function renderResumen(){
  let ok=0,low=0,out=0,na=0;
  for(const c of['bebidas','alimentos']){
    const all=[...Object.values(CATALOGO[c]).flat(),...(customProductos[c]||[])];
    all.forEach(p=>{ const st=getInv(c,p).status; if(st==='ok')ok++; else if(st==='low')low++; else if(st==='out')out++; else na++; });
  }
  document.getElementById('inv-resumen').innerHTML=`
    <div class="res-card res-ok"><div class="res-num">${ok}</div><div class="res-lbl">Suficiente</div></div>
    <div class="res-card res-low"><div class="res-num">${low}</div><div class="res-lbl">Poco</div></div>
    <div class="res-card res-out"><div class="res-num">${out}</div><div class="res-lbl">Agotado</div></div>
    <div class="res-card res-na"><div class="res-num">${na}</div><div class="res-lbl">Sin revisar</div></div>`;
}

async function enviarInventario(){
  const resp=document.getElementById('inv-resp').value;
  if(!resp){ notif('Selecciona tu nombre primero'); return; }
  const btn=document.getElementById('btn-enviar-inv');
  btn.disabled=true; btn.textContent='Enviando...';
  const fecha=fechaHoy();
  try{
    const rows=[];
    for(const tipo of['bebidas','alimentos']){
      const all=[...Object.values(CATALOGO[tipo]).flat(),...(customProductos[tipo]||[])];
      all.forEach(prod=>{
        const d=getInv(tipo,prod);
        const cat=Object.entries(CATALOGO[tipo]).find(([,items])=>items.includes(prod))?.[0]||'Otros';
        rows.push({fecha,tipo,categoria:cat,producto:prod,status:d.status||'sin_revisar',cantidad:d.qty||null,nota:d.nota||null,responsable:resp});
      });
    }
    const{error}=await sb.from('inventario').upsert(rows,{onConflict:'fecha,tipo,producto'});
    if(error) throw error;
    notif('✅ Inventario enviado');
    btn.textContent='✓ Enviado';
    btn.classList.add('enviado');
  }catch(e){
    notif('Error al enviar. Intenta de nuevo.');
    btn.disabled=false; btn.textContent='Enviar inventario';
  }
}

async function cargarProductosCustom(){
  try{
    const{data}=await sb.from('productos_custom').select('nombre,categoria').order('nombre');
    (data||[]).forEach(r=>{
      const nombre=r.nombre;
      const cat=r.categoria||'alimentos';
      const enCatalogo=Object.values(CATALOGO['bebidas']).flat().includes(nombre)||Object.values(CATALOGO['alimentos']).flat().includes(nombre);
      if(!enCatalogo){
        if(!customProductos[cat])customProductos[cat]=[];
        if(!customProductos[cat].includes(nombre)) customProductos[cat].push(nombre);
      }
    });
  }catch(e){ console.error(e); }
}

async function addProducto(){
  const nombre=prompt('Nombre del producto a añadir:');
  if(!nombre?.trim()) return;
  try{
    await sb.from('productos_custom').upsert({nombre:nombre.trim(),categoria:catInv,creado_por:'checklist'},{onConflict:'nombre'});
  }catch(e){ console.error(e); }
  if(!customProductos[catInv])customProductos[catInv]=[];
  if(!customProductos[catInv].includes(nombre.trim())){
    customProductos[catInv].push(nombre.trim());
    renderInv();
  }
}

// ─── ADMIN CALENDARIO ────────────────────────────────────────
async function iniciarCalendario(){
  await cargarResumenMes();
  renderCalendario();
}

function cambiarMes(delta){
  calMes+=delta;
  if(calMes>11){calMes=0;calAnio++;}
  if(calMes<0){calMes=11;calAnio--;}
  calDiaSel=null;
  document.getElementById('cal-detalle').style.display='none';
  cargarResumenMes().then(renderCalendario);
}

async function cargarResumenMes(){
  calResumen={};
  const primerDia=`${calAnio}-${String(calMes+1).padStart(2,'0')}-01`;
  const ultimoDia=`${calAnio}-${String(calMes+1).padStart(2,'0')}-${new Date(calAnio,calMes+1,0).getDate()}`;
  try{
    // Checklist limpieza
    const{data:checkData}=await sb.from('checklist_limpieza').select('fecha,turno,responsable').gte('fecha',primerDia).lte('fecha',ultimoDia);
    (checkData||[]).forEach(r=>{
      if(!calResumen[r.fecha])calResumen[r.fecha]={turnos:new Set(),tieneInv:false};
      calResumen[r.fecha].turnos.add(r.turno);
    });
    // Inventario
    const{data:invData}=await sb.from('inventario').select('fecha').gte('fecha',primerDia).lte('fecha',ultimoDia);
    (invData||[]).forEach(r=>{
      if(!calResumen[r.fecha])calResumen[r.fecha]={turnos:new Set(),tieneInv:false};
      calResumen[r.fecha].tieneInv=true;
    });
  }catch(e){ console.error(e); }
}

function renderCalendario(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('cal-mes-lbl').textContent=`${meses[calMes]} ${calAnio}`;
  const hoyStr=fechaHoy();
  const primerDia=new Date(calAnio,calMes,1);
  const diasEnMes=new Date(calAnio,calMes+1,0).getDate();
  const offset=(primerDia.getDay()+6)%7;
  let html='';
  for(let i=0;i<offset;i++) html+=`<div class="cal-dia vacio"></div>`;
  for(let d=1;d<=diasEnMes;d++){
    const f=`${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const res=calResumen[f];
    const esHoy=f===hoyStr, esSel=f===calDiaSel, tieneDatos=!!res;
    let cls='cal-dia';
    if(tieneDatos)cls+=' con-datos';
    if(esHoy)cls+=' hoy';
    if(esSel)cls+=' sel';
    const turnos=res&&res.turnos?.size?[...res.turnos].map(t=>t==='M'?'☀️':'🌙').join(''):'';
    const invIco=res?.tieneInv?'📦':'';
    html+=`<div class="${cls}" onclick="selDia('${f}')">
      <div class="cal-dia-num">${d}</div>
      ${tieneDatos?`<div class="cal-dia-cnt">${turnos}${invIco}</div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

async function selDia(fecha){
  calDiaSel=fecha;
  renderCalendario();
  const det=document.getElementById('cal-detalle');
  det.style.display='block';
  document.getElementById('cal-det-body').innerHTML='<div class="loading">Cargando...</div>';
  const[anio,mes,dia]=fecha.split('-');
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('cal-det-fecha').textContent=`${parseInt(dia)} de ${meses[parseInt(mes)-1]} de ${anio}`;
  try{
    // Cargar checklist limpieza
    const{data:checkData}=await sb.from('checklist_limpieza').select('*').eq('fecha',fecha).order('turno').order('actividad');
    // Cargar inventario
    const{data:invData}=await sb.from('inventario').select('*').eq('fecha',fecha).order('tipo').order('categoria').order('producto');

    let html='';

    // ── SECCIÓN LIMPIEZA ──
    html+=`<div class="section-lbl" style="margin-top:0">🏠 Checklist de Limpieza</div>`;
    if(!checkData?.length){
      html+=`<div class="cal-empty">Sin registros de limpieza este día</div>`;
    } else {
      const grupos={};
      checkData.forEach(r=>{
        const k=`${r.turno}__${r.responsable}`;
        if(!grupos[k])grupos[k]={turno:r.turno,responsable:r.responsable,items:[]};
        grupos[k].items.push(r);
      });
      Object.values(grupos).forEach(g=>{
        const done=g.items.filter(i=>i.completado).length;
        const total=g.items.length;
        const pct=Math.round(done/total*100);
        html+=`<div class="cal-reporte-card">
          <div class="cal-reporte-top">
            <div>
              <div class="cal-reporte-quien">${g.responsable}</div>
              <span class="cal-reporte-turno ${g.turno==='M'?'turno-m':'turno-v'}">${g.turno==='M'?'☀️ Matutino':'🌙 Vespertino'}</span>
            </div>
            <div style="text-align:right">
              <div class="cal-reporte-pct">${pct}%</div>
              <div class="cal-reporte-sub">${done}/${total} actividades</div>
            </div>
          </div>
          <div class="cal-items-wrap">
            ${g.items.map(i=>`<span class="cal-item-chip${i.completado?' done':''}">${i.completado?'✓':''} ${i.actividad}</span>`).join('')}
          </div>
        </div>`;
      });
    }

    // ── SECCIÓN INVENTARIO ──
    html+=`<div class="section-lbl" style="margin-top:16px">📦 Inventario</div>`;
    if(!invData?.length){
      html+=`<div class="cal-empty">Sin registros de inventario este día</div>`;
    } else {
      // Agrupar por tipo+responsable
      const gruposInv={};
      invData.forEach(r=>{
        const k=`${r.tipo}__${r.responsable}`;
        if(!gruposInv[k])gruposInv[k]={tipo:r.tipo,responsable:r.responsable,items:[]};
        gruposInv[k].items.push(r);
      });
      Object.values(gruposInv).forEach(g=>{
        const agotados=g.items.filter(i=>i.status==='out');
        const pocos=g.items.filter(i=>i.status==='low');
        const ok=g.items.filter(i=>i.status==='ok');
        const sinRevisar=g.items.filter(i=>!i.status||i.status==='sin_revisar');
        html+=`<div class="cal-reporte-card">
          <div class="cal-reporte-top">
            <div>
              <div class="cal-reporte-quien">${g.responsable}</div>
              <span class="cal-reporte-turno turno-m">${g.tipo==='bebidas'?'☕ Bebidas':'🥐 Alimentos'}</span>
            </div>
            <div style="text-align:right;font-size:12px;line-height:1.6">
              ${agotados.length?`<div style="color:var(--out)">✕ ${agotados.length} agotado${agotados.length>1?'s':''}</div>`:''}
              ${pocos.length?`<div style="color:var(--low)">⚠ ${pocos.length} poco${pocos.length>1?'s':''}</div>`:''}
              ${ok.length?`<div style="color:var(--ok)">✓ ${ok.length} bien</div>`:''}
              ${sinRevisar.length?`<div style="color:var(--seco)">— ${sinRevisar.length} sin revisar</div>`:''}
            </div>
          </div>
          ${agotados.length||pocos.length?`
          <div class="cal-items-wrap">
            ${agotados.map(i=>`<span class="cal-item-chip" style="background:var(--out-bg);border-color:var(--out-bd);color:var(--out)">✕ ${i.producto}</span>`).join('')}
            ${pocos.map(i=>`<span class="cal-item-chip" style="background:var(--low-bg);border-color:var(--low-bd);color:var(--low)">⚠ ${i.producto}</span>`).join('')}
          </div>`:''}
        </div>`;
      });
    }

    document.getElementById('cal-det-body').innerHTML=html;
  }catch(e){
    document.getElementById('cal-det-body').innerHTML='<div class="cal-empty">Error al cargar registros</div>';
  }
}

// ─── EXCEL ───────────────────────────────────────────────────
async function descargarExcelDia(){
  if(!calDiaSel){ notif('Selecciona un día primero'); return; }
  notif('Generando Excel...');
  try{
    const{data:checkData}=await sb.from('checklist_limpieza').select('*').eq('fecha',calDiaSel).order('turno').order('responsable');
    const{data:invData}=await sb.from('inventario').select('*').eq('fecha',calDiaSel).order('tipo').order('categoria').order('producto');
    const wb=XLSX.utils.book_new();

    // ── HOJA 1: LIMPIEZA ──────────────────────────────────────
    {
      const todasActividades=[...INMUEBLES,...TRABAJO];
      // Agrupar por responsable+turno — clave única por persona
      const grupos={};
      (checkData||[]).forEach(r=>{
        const k=`${r.responsable}__${r.turno}`;
        if(!grupos[k])grupos[k]={responsable:r.responsable,turno:r.turno,checks:{}};
        grupos[k].checks[r.actividad]=r.completado;
      });

      const wsData=[];
      // Fila 1: encabezados
      wsData.push(['Trabajador','Turno',...todasActividades,'% Completado']);
      // Una fila por persona+turno
      Object.values(grupos).forEach(g=>{
        const done=todasActividades.filter(a=>g.checks[a]).length;
        const pct=Math.round(done/todasActividades.length*100)+'%';
        wsData.push([
          g.responsable,
          g.turno==='M'?'Matutino':'Vespertino',
          ...todasActividades.map(a=>g.checks[a]?'✓':''),
          pct
        ]);
      });

      if(wsData.length===1) wsData.push(['Sin registros de limpieza para este día']);

      const ws=XLSX.utils.aoa_to_sheet(wsData);
      ws['!cols']=[{wch:16},{wch:12},...todasActividades.map(()=>({wch:20})),{wch:14}];

      // Verde en celdas ✓
      wsData.forEach((fila,ri)=>{
        if(ri===0)return;
        fila.forEach((val,ci)=>{
          if(val==='✓'){
            const ref=XLSX.utils.encode_cell({r:ri,c:ci});
            if(ws[ref]) ws[ref].s={fill:{fgColor:{rgb:'C6EFCE'}},font:{color:{rgb:'276221'},bold:true},alignment:{horizontal:'center'}};
          }
        });
      });
      XLSX.utils.book_append_sheet(wb,ws,'Limpieza');
    }

    // ── HOJA 2: INVENTARIO ────────────────────────────────────
    {
      // Obtener lista única de productos en el orden del catálogo
      const todosProductos=[];
      for(const tipo of['bebidas','alimentos']){
        for(const items of Object.values(CATALOGO[tipo])){
          items.forEach(p=>{ if(!todosProductos.includes(p)) todosProductos.push(p); });
        }
      }

      // Agrupar por responsable — una fila por persona
      const grupos={};
      (invData||[]).forEach(r=>{
        const k=r.responsable;
        if(!grupos[k])grupos[k]={responsable:r.responsable,productos:{}};
        grupos[k].productos[r.producto]={status:r.status,cantidad:r.cantidad||'',nota:r.nota||''};
      });

      // ── FILTRAR productos donde TODOS tienen cantidad Y nota vacías ──
      const responsables=Object.keys(grupos);
      const productosConDatos=todosProductos.filter(p=>{
        return responsables.some(r=>{
          const d=grupos[r].productos[p];
          return d && (d.cantidad||d.nota);
        });
      });

      // Si no hay ningún producto con datos, usar todos
      const productosFinales=productosConDatos.length>0 ? productosConDatos : todosProductos;

      // Fila 1: nombre de producto (cada producto ocupa 2 columnas: Cantidad | Nota)
      const fila1=['Nombre'];
      productosFinales.forEach(p=>{ fila1.push(p,''); });
      // Fila 2: sub-encabezados Cantidad | Nota
      const fila2=[''];
      productosFinales.forEach(()=>{ fila2.push('Cantidad','Nota'); });

      const wsData=[fila1,fila2];

      // Una fila por responsable
      Object.values(grupos).forEach(g=>{
        const fila=[g.responsable];
        productosFinales.forEach(p=>{
          const d=g.productos[p];
          if(d){ fila.push(d.cantidad||'',d.nota||''); }
          else { fila.push('',''); }
        });
        wsData.push(fila);
      });

      if(wsData.length===2) wsData.push(['Sin registros de inventario para este día']);

      const ws=XLSX.utils.aoa_to_sheet(wsData);

      // Combinar celdas del encabezado de producto (cada uno ocupa 2 columnas)
      if(!ws['!merges']) ws['!merges']=[];
      productosFinales.forEach((_,i)=>{
        const col=1+(i*2);
        ws['!merges'].push({s:{r:0,c:col},e:{r:0,c:col+1}});
      });

      // Anchos: nombre=16, luego pares Cantidad+Nota
      ws['!cols']=[{wch:16},...productosFinales.flatMap(()=>[{wch:14},{wch:24}])];

      // Colorear cantidad según status
      (invData||[]).forEach(r=>{
        const colIdx=productosFinales.indexOf(r.producto);
        if(colIdx<0)return; // producto filtrado, omitir
        const rowIdx=responsables.indexOf(r.responsable);
        if(rowIdx<0)return;
        const ri=rowIdx+2;
        const ci=1+(colIdx*2);
        const ref=XLSX.utils.encode_cell({r:ri,c:ci});
        if(!ws[ref])return;
        if(r.status==='ok')       ws[ref].s={fill:{fgColor:{rgb:'C6EFCE'}},font:{color:{rgb:'276221'}}};
        else if(r.status==='low') ws[ref].s={fill:{fgColor:{rgb:'FFEB9C'}},font:{color:{rgb:'9C6500'}}};
        else if(r.status==='out') ws[ref].s={fill:{fgColor:{rgb:'FFC7CE'}},font:{color:{rgb:'9C0006'}}};
      });

      XLSX.utils.book_append_sheet(wb,ws,'Inventario');
    }

    XLSX.writeFile(wb,`checklist_${calDiaSel}.xlsx`);
    notif('✅ Excel descargado');
  }catch(e){
    console.error(e);
    notif('Error al generar Excel');
  }
}
