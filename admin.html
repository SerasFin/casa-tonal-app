<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Tonal — Admin</title>
<meta name="theme-color" content="#1A0F0A">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0F0804;--bg2:#1A0F0A;--bg3:#241510;--cafe:#2C1810;--cafe-light:#6B3A2A;
  --crema:#F5EDD6;--crema-dim:rgba(245,237,214,.6);--crema-muted:rgba(245,237,214,.25);
  --verde:#1D6A35;--verde-bg:#0D2E18;--rojo:#8B1A1A;--rojo-bg:#2E0D0D;
  --amarillo:#8B6914;--amarillo-bg:#2E220A;--azul:#1A3A6B;--azul-bg:#0D1A2E;
  --texto:var(--crema);--texto-suave:var(--crema-dim);--radio:12px;--radio-sm:8px
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;overflow-x:hidden}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:2rem}
.login-logo{font-family:'Playfair Display',serif;font-size:32px;color:var(--crema);text-align:center}
.login-sub{font-size:13px;color:var(--crema-dim);text-align:center;margin-top:-.5rem}
.login-card{background:var(--bg2);border:1px solid rgba(245,237,214,.1);border-radius:var(--radio);padding:2rem;width:320px;display:flex;flex-direction:column;gap:1rem}
.login-campo label{display:block;font-size:11px;color:var(--crema-dim);margin-bottom:.4rem;font-family:'DM Mono',monospace;letter-spacing:.5px}
.login-campo input{width:100%;padding:.7rem 1rem;background:var(--bg3);border:1px solid rgba(245,237,214,.15);border-radius:var(--radio-sm);color:var(--crema);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.login-campo input:focus{border-color:rgba(245,237,214,.4)}
.login-btn{width:100%;padding:.85rem;background:var(--cafe-light);border:none;border-radius:var(--radio-sm);color:var(--crema);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:background .2s}
.login-btn:hover{background:#7a4533}
.login-error{font-size:12px;color:#e06060;text-align:center;display:none}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid rgba(245,237,214,.08);padding:.85rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.header-logo{font-family:'Playfair Display',serif;font-size:18px;color:var(--crema)}
.header-right{display:flex;align-items:center;gap:1rem}
.badge-nuevo{background:var(--rojo);color:var(--crema);border-radius:50px;padding:.2rem .6rem;font-size:11px;font-weight:500;display:none}
.badge-nuevo.visible{display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.user-tag{font-size:12px;color:var(--crema-dim);font-family:'DM Mono',monospace}
.logout-btn{background:transparent;border:1px solid rgba(245,237,214,.2);border-radius:50px;padding:.3rem .8rem;color:var(--crema-dim);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.logout-btn:hover{border-color:var(--crema-dim);color:var(--crema)}
.gasto-btn{background:rgba(139,105,20,.3);border:1px solid var(--amarillo);border-radius:50px;padding:.3rem .8rem;color:#d4a843;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.gasto-btn:hover{background:rgba(139,105,20,.5)}

/* TABS */
.tabs-bar{background:var(--bg2);border-bottom:1px solid rgba(245,237,214,.08);padding:.75rem 1.5rem;display:flex;gap:.75rem}
.tab-btn{padding:.45rem 1rem;border-radius:50px;border:1px solid rgba(245,237,214,.15);background:transparent;color:var(--crema-dim);font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.tab-btn.activo{background:var(--cafe-light);border-color:var(--cafe-light);color:var(--crema);font-weight:500}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;padding:1.25rem 1.5rem}
.stat-card{background:var(--bg2);border:1px solid rgba(245,237,214,.08);border-radius:var(--radio);padding:.85rem 1rem}
.stat-label{font-size:11px;color:var(--crema-dim);font-family:'DM Mono',monospace;letter-spacing:.5px;margin-bottom:.35rem}
.stat-valor{font-family:'Playfair Display',serif;font-size:22px;color:var(--crema)}
.stat-sub{font-size:11px;color:var(--crema-dim);margin-top:.2rem}
.stat-card.gasto-card{border-color:rgba(139,105,20,.4)}
.stat-card.gasto-card .stat-valor{color:#d4a843}
.stat-card.ganancia-card{border-color:rgba(29,106,53,.4)}
.stat-card.ganancia-card .stat-valor{color:#5cb87a}
.stat-card.cancelado-card{border-color:rgba(139,26,26,.4)}
.stat-card.cancelado-card .stat-valor{color:#e06060}

/* VISTAS */
.vista{display:none;padding:0 1.5rem 1.5rem}
.vista.activa{display:block}
.filtros{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.filtro-btn{padding:.35rem .85rem;border-radius:50px;border:1px solid rgba(245,237,214,.15);background:transparent;color:var(--crema-dim);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.filtro-btn.activo{border-color:var(--cafe-light);color:var(--crema);background:rgba(107,58,42,.3)}
.pedidos-lista{display:flex;flex-direction:column;gap:.75rem}
.pedido-card{background:var(--bg2);border:1px solid rgba(245,237,214,.08);border-radius:var(--radio);overflow:hidden;transition:border-color .2s}
.pedido-card:hover{border-color:rgba(245,237,214,.2)}
.pedido-card.nuevo{border-color:var(--rojo);animation:nuevoBorde 2s ease-in-out}
@keyframes nuevoBorde{0%,100%{border-color:var(--rojo)}50%{border-color:#e06060}}
.pedido-header{display:flex;align-items:center;justify-content:space-between;padding:.85rem 1rem;cursor:pointer}
.pedido-id{font-family:'DM Mono',monospace;font-size:13px;color:var(--crema-dim)}
.pedido-cliente{font-size:14px;font-weight:500;color:var(--crema)}
.pedido-meta{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.chip{padding:.25rem .6rem;border-radius:50px;font-size:11px;font-weight:500}
.chip-domicilio{background:var(--azul-bg);color:#6fa3e0;border:1px solid #1a3a6b}
.chip-recoger{background:var(--amarillo-bg);color:#d4a843;border:1px solid #4a3a10}
.chip-efectivo{background:var(--verde-bg);color:#5cb87a;border:1px solid #1d4a2a}
.chip-mp{background:var(--azul-bg);color:#6fa3e0;border:1px solid #1a3a6b}
.chip-estado{padding:.25rem .7rem;border-radius:50px;font-size:11px;font-weight:500}
.estado-recibido{background:var(--rojo-bg);color:#e06060;border:1px solid var(--rojo)}
.estado-preparando{background:var(--amarillo-bg);color:#d4a843;border:1px solid var(--amarillo)}
.estado-en_camino{background:var(--azul-bg);color:#6fa3e0;border:1px solid var(--azul)}
.estado-listo{background:var(--azul-bg);color:#6fa3e0;border:1px solid var(--azul)}
.estado-entregado{background:var(--verde-bg);color:#5cb87a;border:1px solid var(--verde)}
.estado-cancelado{background:var(--bg3);color:var(--crema-dim);border:1px solid rgba(245,237,214,.15)}
.pedido-total{font-family:'Playfair Display',serif;font-size:16px;color:var(--crema)}
.pedido-body{display:none;border-top:1px solid rgba(245,237,214,.08);padding:1rem}
.pedido-body.abierto{display:block}
.pedido-items{margin-bottom:1rem}
.pedido-item-row{display:flex;justify-content:space-between;font-size:13px;padding:.3rem 0;border-bottom:.5px solid rgba(245,237,214,.06)}
.pedido-item-row:last-child{border:none}
.pedido-item-nombre{color:var(--crema-dim)}
.pedido-item-precio{color:var(--crema);font-weight:500}
.pedido-dir{font-size:12px;color:var(--crema-dim);margin-bottom:.75rem;padding:.5rem .75rem;background:var(--bg3);border-radius:var(--radio-sm)}
.pedido-notas{font-size:12px;color:#d4a843;margin-bottom:.75rem;padding:.5rem .75rem;background:var(--amarillo-bg);border-radius:var(--radio-sm);border-left:2px solid var(--amarillo)}
.acciones{display:flex;gap:.5rem;flex-wrap:wrap}
.accion-btn{padding:.5rem 1rem;border-radius:var(--radio-sm);border:none;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-preparando{background:var(--amarillo-bg);color:#d4a843;border:1px solid var(--amarillo)}
.btn-camino{background:var(--azul-bg);color:#6fa3e0;border:1px solid var(--azul)}
.btn-listo{background:var(--azul-bg);color:#6fa3e0;border:1px solid var(--azul)}
.btn-entregado{background:var(--verde-bg);color:#5cb87a;border:1px solid var(--verde)}
.btn-cancelar{background:var(--rojo-bg);color:#e06060;border:1px solid var(--rojo)}

/* KANBAN */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;align-items:start}
.kanban-col{background:var(--bg2);border:1px solid rgba(245,237,214,.08);border-radius:var(--radio);overflow:hidden}
.kanban-header{padding:.75rem 1rem;border-bottom:1px solid rgba(245,237,214,.08);display:flex;align-items:center;justify-content:space-between}
.kanban-titulo{font-size:13px;font-weight:500;font-family:'DM Mono',monospace;letter-spacing:.5px}
.kanban-count{background:var(--bg3);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--crema-dim)}
.kanban-items{padding:.75rem;display:flex;flex-direction:column;gap:.5rem;min-height:100px}
.kanban-card{background:var(--bg3);border:1px solid rgba(245,237,214,.08);border-radius:var(--radio-sm);padding:.75rem;cursor:pointer;transition:border-color .2s}
.kanban-card:hover{border-color:rgba(245,237,214,.25)}
.kanban-nombre{font-size:13px;font-weight:500;margin-bottom:.35rem}
.kanban-detalle{font-size:11px;color:var(--crema-dim);line-height:1.5}
.kanban-total{font-family:'Playfair Display',serif;font-size:14px;color:var(--crema);margin-top:.35rem}
.kanban-vacio{font-size:12px;color:rgba(245,237,214,.2);text-align:center;padding:1rem;font-style:italic}

/* MODAL GASTO */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg2);border:1px solid rgba(139,105,20,.5);border-radius:var(--radio);padding:28px 24px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.modal-box h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--crema);margin-bottom:4px}
.modal-box p{font-size:13px;color:var(--crema-dim);margin-bottom:20px}
.modal-field label{display:block;font-size:11px;color:var(--crema-dim);margin-bottom:6px;font-family:'DM Mono',monospace;letter-spacing:.5px}
.modal-field input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid rgba(245,237,214,.15);border-radius:var(--radio-sm);color:var(--crema);font-size:18px;font-family:'Playfair Display',serif;outline:none}
.modal-field input:focus{border-color:rgba(139,105,20,.7)}
.modal-actual{font-size:12px;color:#d4a843;margin-top:8px}
.modal-btn-guardar{width:100%;padding:12px;background:rgba(139,105,20,.4);border:1px solid var(--amarillo);border-radius:var(--radio-sm);color:#d4a843;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;margin-top:16px}
.modal-btn-guardar:hover{background:rgba(139,105,20,.6)}
.modal-btn-cancel{width:100%;padding:10px;background:transparent;border:1px solid rgba(245,237,214,.15);border-radius:var(--radio-sm);color:var(--crema-dim);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:8px}

/* NOTIF */
.notif-toast{position:fixed;top:1rem;right:1rem;background:var(--bg2);border:1px solid var(--cafe-light);border-radius:var(--radio);padding:1rem 1.25rem;z-index:600;display:none;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.notif-toast.visible{display:block;animation:slideIn .3s ease}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.notif-titulo{font-size:14px;font-weight:500;color:var(--crema);margin-bottom:.25rem}
.notif-body{font-size:12px;color:var(--crema-dim)}
.empty-state{text-align:center;padding:3rem;color:var(--crema-dim);font-size:14px}

/* CALENDARIO */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 4px}
.cal-nav-btn{background:var(--bg2);border:1px solid rgba(245,237,214,.15);border-radius:8px;color:var(--crema);font-size:18px;width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{border-color:rgba(245,237,214,.4)}
.cal-mes-lbl{font-family:'Playfair Display',serif;font-size:18px;color:var(--crema);text-transform:capitalize}
.cal-dias-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.cal-dias-semana span{text-align:center;font-size:11px;color:var(--crema-dim);font-family:'DM Mono',monospace;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal-dia{min-height:56px;border-radius:8px;border:1px solid rgba(245,237,214,.06);background:var(--bg2);padding:6px;cursor:pointer;transition:all .15s;position:relative}
.cal-dia:hover{border-color:rgba(245,237,214,.25)}
.cal-dia.vacio{background:transparent;border-color:transparent;cursor:default}
.cal-dia.hoy{border-color:var(--cafe-light)!important}
.cal-dia.seleccionado{border-color:rgba(245,237,214,.5);background:var(--bg3)}
.cal-dia.con-ventas{border-color:rgba(29,106,53,.4)}
.cal-dia.con-ventas.seleccionado{border-color:#5cb87a}
.cal-dia-num{font-size:12px;font-weight:500;color:var(--crema-dim)}
.cal-dia.hoy .cal-dia-num{color:var(--crema);font-weight:600}
.cal-dia.con-ventas .cal-dia-num{color:var(--crema)}
.cal-dia-monto{font-size:11px;color:#5cb87a;margin-top:3px;font-weight:500}
.cal-dia-gastos{font-size:10px;color:#d4a843;margin-top:1px}
.cal-dia-dot{width:5px;height:5px;border-radius:50%;background:#5cb87a;position:absolute;bottom:6px;right:6px}

/* DETALLE DÍA */
.cal-detalle{background:var(--bg2);border:1px solid rgba(245,237,214,.1);border-radius:var(--radio);padding:16px;margin-top:4px}
.cal-detalle-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.cal-detalle-fecha{font-family:'Playfair Display',serif;font-size:18px;color:var(--crema)}
.cal-detalle-sub{font-size:12px;color:var(--crema-dim);margin-top:2px}
.cal-excel-btn{background:rgba(29,106,53,.3);border:1px solid var(--verde);border-radius:8px;color:#5cb87a;font-size:12px;font-weight:500;padding:6px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap}
.cal-excel-btn:hover{background:rgba(29,106,53,.5)}
.cal-stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cal-stat{background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid rgba(245,237,214,.06)}
.cal-stat-lbl{font-size:10px;color:var(--crema-dim);font-family:'DM Mono',monospace;letter-spacing:.5px;margin-bottom:4px}
.cal-stat-val{font-family:'Playfair Display',serif;font-size:18px;color:var(--crema)}
.cal-stat-val.verde{color:#5cb87a}
.cal-stat-val.amarillo{color:#d4a843}
.cal-stat-val.rojo{color:#e06060}
.cal-registros-titulo{font-size:11px;color:var(--crema-dim);font-family:'DM Mono',monospace;letter-spacing:.5px;margin-bottom:8px}
.cal-pedido-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg3);border-radius:8px;margin-bottom:5px;border:1px solid rgba(245,237,214,.06)}
.cal-pedido-id{font-family:'DM Mono',monospace;font-size:12px;color:var(--crema-dim)}
.cal-pedido-info{font-size:12px;color:var(--crema-dim)}
.cal-pedido-total{font-family:'Playfair Display',serif;font-size:14px;color:var(--crema)}
.cal-pedido-estado{font-size:10px;padding:2px 7px;border-radius:20px}
.cal-empty{text-align:center;padding:24px;color:var(--crema-dim);font-size:13px}
.cal-loading{text-align:center;padding:20px;color:var(--crema-dim);font-size:13px}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div>
    <div class="login-logo">Casa Tonal</div>
    <div class="login-sub">Panel de administración</div>
  </div>
  <div class="login-card">
    <div class="login-campo"><label>USUARIO</label><input type="text" id="inp-user" placeholder="admin / empleado"/></div>
    <div class="login-campo"><label>CONTRASEÑA</label><input type="password" id="inp-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()"/></div>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
    <button class="login-btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- MODAL GASTO -->
<div class="modal-overlay" id="modal-gasto" style="display:none" onclick="if(event.target===this)cerrarModalGasto()">
  <div class="modal-box">
    <h2>💸 Gasto del día</h2>
    <p id="modal-gasto-fecha"></p>
    <div class="modal-field">
      <label>IMPORTE TOTAL DE GASTOS</label>
      <input type="number" id="inp-gasto" placeholder="0.00" min="0" step="0.01"/>
      <div class="modal-actual" id="gasto-actual"></div>
    </div>
    <button class="modal-btn-guardar" onclick="guardarGasto()">Guardar gasto</button>
    <button class="modal-btn-cancel" onclick="cerrarModalGasto()">Cancelar</button>
  </div>
</div>

<!-- NOTIF -->
<div class="notif-toast" id="notif-toast">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem">
    <div>
      <div class="notif-titulo" id="notif-titulo"></div>
      <div class="notif-body" id="notif-body"></div>
    </div>
    <button onclick="document.getElementById('notif-toast').classList.remove('visible')" style="background:rgba(245,237,214,.15);border:none;border-radius:50%;width:24px;height:24px;color:var(--crema);cursor:pointer;font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center">✕</button>
  </div>
  <button onclick="document.getElementById('notif-toast').classList.remove('visible')" style="margin-top:.75rem;width:100%;padding:.5rem;background:var(--cafe-light);border:none;border-radius:var(--radio-sm);color:var(--crema);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;font-weight:500">Ver ✓</button>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <span class="header-logo">Casa Tonal · Admin</span>
    <div class="header-right">
      <span class="badge-nuevo" id="badge-nuevo">● NUEVO PEDIDO</span>
      <span class="user-tag" id="user-tag"></span>
      <button class="gasto-btn" onclick="abrirModalGasto()">💸 Gasto</button>
      <button class="logout-btn" onclick="generarReportes()" style="border-color:rgba(245,237,214,.4)">📊 Reporte</button>
      <button class="logout-btn" onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="tabs-bar">
    <button class="tab-btn activo" onclick="cambiarTab('lista',this)">Lista</button>
    <button class="tab-btn" onclick="cambiarTab('calendario',this)">📅 Calendario</button>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="stat-card"><div class="stat-label">HOY</div><div class="stat-valor" id="stat-hoy">0</div><div class="stat-sub">pedidos totales</div></div>
    <div class="stat-card"><div class="stat-label">VENTAS HOY</div><div class="stat-valor" id="stat-ventas">$0</div><div class="stat-sub">ingresos</div></div>
    <div class="stat-card gasto-card"><div class="stat-label">GASTOS HOY</div><div class="stat-valor" id="stat-gastos">$0</div><div class="stat-sub">registrado</div></div>
    <div class="stat-card ganancia-card"><div class="stat-label">GANANCIA</div><div class="stat-valor" id="stat-ganancia">$0</div><div class="stat-sub">neta del día</div></div>
    <div class="stat-card cancelado-card"><div class="stat-label">CANCELADOS</div><div class="stat-valor" id="stat-cancelados">0</div><div class="stat-sub">transacciones</div></div>
  </div>

  <div class="vista activa" id="vista-lista">
    <div class="filtros">
      <button class="filtro-btn activo" onclick="filtrar('todos',this)">Todos</button>

// ─── PEDIDOS ──────────────────────────────────────────────────
async function cargarPedidos(){
  try{
    const hoy=new Date(); hoy.setHours(0,0,0,0);
    const{data}=await sb.from('pedidos').select('*, clientes(nombre, telefono)').gte('creado_en',hoy.toISOString()).order('creado_en',{ascending:false});
    pedidos=data||[];
    await cargarItems();
    renderTodo();
  }catch(e){console.error(e);}
}
async function cargarItems(){
  if(!pedidos.length)return;
  const ids=pedidos.map(p=>p.id);
  const{data:items}=await sb.from('pedido_items').select('*, productos!pedido_items_producto_id_fkey(nombre)').in('pedido_id',ids);
  pedidos.forEach(p=>{p._items=(items||[]).filter(i=>i.pedido_id===p.id);});
}
function suscribirRealtime(){
  sb.channel('pedidos-realtime')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pedidos'},async(payload)=>{
      const nuevo=payload.new;
      const{data:cliente}=await sb.from('clientes').select('nombre,telefono').eq('id',nuevo.cliente_id).single();
      const{data:items}=await sb.from('pedido_items').select('*, productos!pedido_items_producto_id_fkey(nombre)').eq('pedido_id',nuevo.id);
      nuevo.clientes=cliente; nuevo._items=items||[]; nuevo._esNuevo=true;
      pedidos.unshift(nuevo);
      renderTodo(); mostrarNotifNuevo(nuevo); sonarAlarma();
      document.getElementById('badge-nuevo').classList.add('visible');
      setTimeout(()=>document.getElementById('badge-nuevo').classList.remove('visible'),8000);
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pedidos'},async(payload)=>{
      const idx=pedidos.findIndex(p=>p.id===payload.new.id);
      if(idx>=0){pedidos[idx]={...pedidos[idx],...payload.new}; renderTodo();}
    })
    .subscribe();
}
function sonarAlarma(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value=880; osc.type='sine';
      gain.gain.setValueAtTime(0,audioCtx.currentTime+t);
      gain.gain.linearRampToValueAtTime(.4,audioCtx.currentTime+t+.05);
      gain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+t+.25);
      osc.start(audioCtx.currentTime+t); osc.stop(audioCtx.currentTime+t+.3);
    });
  }catch(e){}
}
function mostrarNotifNuevo(p){
  document.getElementById('notif-titulo').textContent='🛵 Nuevo pedido #'+p.id.slice(-6).toUpperCase();
  document.getElementById('notif-body').textContent=`${p.clientes?.nombre||'Cliente'} · ${p.tipo==='domicilio'?'Domicilio':'Recoger'} · $${Math.round(p.total)}`;
  document.getElementById('notif-toast').classList.add('visible');
}

// ─── GASTO ────────────────────────────────────────────────────
function fechaHoyMex(){
  return new Date().toLocaleDateString('es-MX',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');
}
async function cargarGastoHoy(){
  try{
    const fecha=fechaHoyMex();
    const{data}=await sb.from('gastos_diarios').select('importe').eq('fecha',fecha).single();
    gastoHoy=data?Number(data.importe):0;
    actualizarStatsGasto();
  }catch(e){ gastoHoy=0; actualizarStatsGasto(); }
}
function actualizarStatsGasto(){
  const ventas=pedidos.filter(p=>p.estado!=='cancelado').reduce((s,p)=>s+Number(p.total),0);
  const ganancia=ventas-gastoHoy;
  document.getElementById('stat-gastos').textContent='$'+Math.round(gastoHoy).toLocaleString();
  document.getElementById('stat-ganancia').textContent='$'+Math.round(ganancia).toLocaleString();
  document.getElementById('stat-ganancia').style.color=ganancia>=0?'#5cb87a':'#e06060';
}
function abrirModalGasto(){
  const fecha=new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('modal-gasto-fecha').textContent=fecha;
  document.getElementById('inp-gasto').value=gastoHoy||'';
  document.getElementById('gasto-actual').textContent=gastoHoy>0?`Gasto actual registrado: $${Math.round(gastoHoy).toLocaleString()}`:'Sin gasto registrado hoy';
  document.getElementById('modal-gasto').style.display='flex';
  setTimeout(()=>document.getElementById('inp-gasto').focus(),100);
}
function cerrarModalGasto(){
  document.getElementById('modal-gasto').style.display='none';
}
async function guardarGasto(){
  const val=parseFloat(document.getElementById('inp-gasto').value);
  if(isNaN(val)||val<0){ alert('Ingresa un importe válido'); return; }
  const fecha=fechaHoyMex();
  try{
    await sb.from('gastos_diarios').upsert({fecha,importe:val,registrado_por:usuarioActual?.nombre||'admin'},{onConflict:'fecha'});
    gastoHoy=val;
    actualizarStatsGasto();
    cerrarModalGasto();
    mostrarNotifToast('💸 Gasto guardado',`$${Math.round(val).toLocaleString()} registrado para hoy`);
  }catch(e){ alert('Error al guardar gasto. Intenta de nuevo.'); }
}
function mostrarNotifToast(titulo,body){
  document.getElementById('notif-titulo').textContent=titulo;
  document.getElementById('notif-body').textContent=body;
  document.getElementById('notif-toast').classList.add('visible');

// ─── RENDER ───────────────────────────────────────────────────
function renderTodo(){ actualizarStats(); if(tabActual==='lista')renderLista(); }
function actualizarStats(){
  const cancelados=pedidos.filter(p=>p.estado==='cancelado').length;
  const ventas=pedidos.filter(p=>p.estado!=='cancelado').reduce((s,p)=>s+Number(p.total),0);
  document.getElementById('stat-hoy').textContent=pedidos.length;
  document.getElementById('stat-ventas').textContent='$'+Math.round(ventas).toLocaleString();
  document.getElementById('stat-cancelados').textContent=cancelados;
  actualizarStatsGasto();

function filtrar(estado,btn){
  filtroActual=estado;
  document.querySelectorAll('.filtro-btn').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo'); renderLista();

function renderLista(){

function cardPedido(p){
  const esAdmin=usuarioActual?.rol==='admin';
  const items=p._items||[];
  const itemsHTML=items.map(i=>`<div class="pedido-item-row"><span class="pedido-item-nombre">${i.cantidad}x ${i.productos?.nombre||'Producto'}</span><span class="pedido-item-precio">$${Math.round(i.subtotal)}</span></div>`).join('');
  return `<div class="pedido-card ${p._esNuevo?'nuevo':''}" id="card-${p.id}">
    <div class="pedido-header" onclick="toggleCard('${p.id}')">
      <div><div class="pedido-id">#${p.id.slice(-6).toUpperCase()} · ${formatHora(p)}</div><div class="pedido-cliente">${p.clientes?.nombre||'Cliente'}</div></div>
      <div class="pedido-meta">
        <span class="chip ${p.tipo==='domicilio'?'chip-domicilio':'chip-recoger'}">${p.tipo==='domicilio'?'🛵':'🏠'} ${p.tipo}</span>
        <span class="chip ${p.pago==='efectivo'?'chip-efectivo':'chip-mp'}">${p.pago==='efectivo'?'💵':'📱'}</span>
        <span class="chip-estado estado-${p.estado}">${labelEstado(p.estado)}</span>
        <span class="pedido-total">$${Math.round(p.total)}</span>
      </div>
    </div>
    <div class="pedido-body" id="body-${p.id}">
      ${p.direccion_entrega?`<div class="pedido-dir">📍 ${p.direccion_entrega}</div>`:''}
      ${p.notas?`<div class="pedido-notas">📝 ${p.notas}</div>`:''}
      <div class="pedido-items">${itemsHTML}</div>
      ${accionesPedido(p,esAdmin)}
    </div>
  </div>`;
}
function accionesPedido(p,esAdmin){
  if(p.estado==='entregado'||p.estado==='cancelado')return '';
  let btns='<div class="acciones">';
  if(p.estado==='recibido')btns+=`<button class="accion-btn btn-preparando" onclick="cambiarEstado('${p.id}','preparando')">Preparando</button>`;
  if(p.estado==='preparando'){
    if(p.tipo==='domicilio')btns+=`<button class="accion-btn btn-camino" onclick="cambiarEstado('${p.id}','en_camino')">En camino</button>`;
    else btns+=`<button class="accion-btn btn-listo" onclick="cambiarEstado('${p.id}','listo')">Listo para recoger</button>`;
  }
  if(p.estado==='en_camino'||p.estado==='listo')btns+=`<button class="accion-btn btn-entregado" onclick="cambiarEstado('${p.id}','entregado')">Entregado</button>`;
  if(esAdmin&&p.estado!=='entregado')btns+=`<button class="accion-btn btn-cancelar" onclick="cambiarEstado('${p.id}','cancelado')">Cancelar</button>`;
  return btns+'</div>';
}
// ─── CALENDARIO ───────────────────────────────────────────────
let calAnio=new Date().getFullYear();
let calMes=new Date().getMonth();
let calDiaSeleccionado=null;
let calResumenMes={};  // { 'YYYY-MM-DD': {ventas, gastos, pedidos} }
let calDiaPedidos=[];  // pedidos del día seleccionado

async function iniciarCalendario(){
  await cargarResumenMes();
  renderCalendario();
}

function cambiarMes(delta){
  calMes+=delta;
  if(calMes>11){calMes=0;calAnio++;}
  if(calMes<0){calMes=11;calAnio--;}
  calDiaSeleccionado=null;
  document.getElementById('cal-detalle').style.display='none';
  cargarResumenMes().then(renderCalendario);
}

async function cargarResumenMes(){
  calResumenMes={};
  const primerDia=`${calAnio}-${String(calMes+1).padStart(2,'0')}-01`;
  const ultimoDia=`${calAnio}-${String(calMes+1).padStart(2,'0')}-${new Date(calAnio,calMes+1,0).getDate()}`;
  try{
    // Pedidos del mes
    const{data:peds}=await sb.from('pedidos')
      .select('id,total,estado,creado_en_local')
      .not('creado_en_local','is',null)
      .neq('estado','cancelado');
    (peds||[]).forEach(p=>{
      const partes=p.creado_en_local.split(',')[0].trim().split('/');
      if(partes.length<3)return;
      // formato dd/mm/yyyy
      const fecha=`${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
      if(fecha<primerDia||fecha>ultimoDia)return;
      if(!calResumenMes[fecha])calResumenMes[fecha]={ventas:0,gastos:0,pedidos:0};
      calResumenMes[fecha].ventas+=Number(p.total);
      calResumenMes[fecha].pedidos+=1;
    });
    // Gastos del mes
    const{data:gastos}=await sb.from('gastos_diarios')
      .select('fecha,importe')
      .gte('fecha',primerDia).lte('fecha',ultimoDia);
    (gastos||[]).forEach(g=>{
      if(!calResumenMes[g.fecha])calResumenMes[g.fecha]={ventas:0,gastos:0,pedidos:0};
      calResumenMes[g.fecha].gastos=Number(g.importe);
    });
  }catch(e){console.error(e);}
}

function renderCalendario(){
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('cal-mes-lbl').textContent=`${meses[calMes]} ${calAnio}`;
  const hoyStr=fechaHoyMex();
  const primerDia=new Date(calAnio,calMes,1);
  const diasEnMes=new Date(calAnio,calMes+1,0).getDate();
  // lunes=0 … domingo=6
  let inicioOffset=(primerDia.getDay()+6)%7;
  let html='';
  for(let i=0;i<inicioOffset;i++) html+=`<div class="cal-dia vacio"></div>`;
  for(let d=1;d<=diasEnMes;d++){
    const fechaStr=`${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const res=calResumenMes[fechaStr];
    const esHoy=fechaStr===hoyStr;
    const esSel=fechaStr===calDiaSeleccionado;
    const tieneVentas=res&&res.ventas>0;
    let cls='cal-dia';
    if(tieneVentas)cls+=' con-ventas';
    if(esHoy)cls+=' hoy';
    if(esSel)cls+=' seleccionado';
    html+=`<div class="${cls}" onclick="seleccionarDia('${fechaStr}')">
      <div class="cal-dia-num">${d}</div>
      ${res&&res.ventas>0?`<div class="cal-dia-monto">$${Math.round(res.ventas).toLocaleString()}</div>`:''}
      ${res&&res.gastos>0?`<div class="cal-dia-gastos">-$${Math.round(res.gastos).toLocaleString()}</div>`:''}
      ${tieneVentas?`<div class="cal-dia-dot"></div>`:''}
    </div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
}

async function seleccionarDia(fecha){
  calDiaSeleccionado=fecha;
  renderCalendario();
  const det=document.getElementById('cal-detalle');
  det.style.display='block';
  document.getElementById('cal-det-registros').innerHTML='<div class="cal-loading">Cargando...</div>';

  // Fecha legible
  const [anio,mes,dia]=fecha.split('-');
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLabel=`${parseInt(dia)} de ${meses[parseInt(mes)-1]} de ${anio}`;
  document.getElementById('cal-det-fecha').textContent=fechaLabel;

  // Stats del día
  const res=calResumenMes[fecha]||{ventas:0,gastos:0,pedidos:0};
  const ganancia=res.ventas-res.gastos;
  document.getElementById('cal-det-sub').textContent=`${res.pedidos} pedido${res.pedidos!==1?'s':''}`;
  document.getElementById('cal-det-stats').innerHTML=`
    <div class="cal-stat"><div class="cal-stat-lbl">VENTAS</div><div class="cal-stat-val verde">$${Math.round(res.ventas).toLocaleString()}</div></div>
    <div class="cal-stat"><div class="cal-stat-lbl">GASTOS</div><div class="cal-stat-val amarillo">$${Math.round(res.gastos).toLocaleString()}</div></div>
    <div class="cal-stat"><div class="cal-stat-lbl">GANANCIA</div><div class="cal-stat-val ${ganancia>=0?'verde':'rojo'}">$${Math.round(ganancia).toLocaleString()}</div></div>`;

  // Pedidos individuales del día
  try{
    const{data:peds}=await sb.from('pedidos')
      .select('id,total,estado,pago,tipo,creado_en_local,notas')
      .not('creado_en_local','is',null)
      .order('creado_en_local',{ascending:true});
    calDiaPedidos=(peds||[]).filter(p=>{
      const partes=p.creado_en_local.split(',')[0].trim().split('/');
      if(partes.length<3)return false;
      const f=`${partes[2]}-${partes[1].padStart(2,'0')}-${partes[0].padStart(2,'0')}`;
      return f===fecha;
    });
    if(!calDiaPedidos.length){
      document.getElementById('cal-det-registros').innerHTML='<div class="cal-empty">Sin pedidos registrados este día</div>';
      return;
    }
    let html=`<div class="cal-registros-titulo">PEDIDOS DEL DÍA</div>`;
    calDiaPedidos.forEach(p=>{
      const hora=p.creado_en_local.split(',')[1]?.trim().substring(0,5)||'';
      const estadoCls={'recibido':'estado-recibido','preparando':'estado-preparando','en_camino':'estado-en_camino','listo':'estado-listo','entregado':'estado-entregado','cancelado':'estado-cancelado'}[p.estado]||'';
      html+=`<div class="cal-pedido-row">
        <div>
          <div class="cal-pedido-id">#${p.id.slice(-6).toUpperCase()} · ${hora}</div>
          <div class="cal-pedido-info">${p.tipo==='domicilio'?'🛵':'🏠'} · ${p.pago==='efectivo'?'💵 Efectivo':'📱 MercadoPago'}</div>
        </div>
        <div style="text-align:right">
          <div class="cal-pedido-total">$${Math.round(p.total)}</div>
          <span class="cal-pedido-estado chip-estado ${estadoCls}">${labelEstado(p.estado)}</span>
        </div>
      </div>`;
    });
    document.getElementById('cal-det-registros').innerHTML=html;
  }catch(e){
    document.getElementById('cal-det-registros').innerHTML='<div class="cal-empty">Error al cargar pedidos</div>';
  }
}

async function generarReporteDia(){
  if(!calDiaSeleccionado){return;}
  const [anio,mes,dia]=calDiaSeleccionado.split('-');
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLabel=`${parseInt(dia)} de ${meses[parseInt(mes)-1]} de ${anio}`;
  const res=calResumenMes[calDiaSeleccionado]||{ventas:0,gastos:0,pedidos:0};
  const ganancia=res.ventas-res.gastos;
  const nombreArchivo=`reporte_${calDiaSeleccionado}`;

  // CSV 1 — Ventas y ganancia del día
  let csv=`REPORTE · ${fechaLabel}\n\n`;
  csv+=`#Pedido,Hora,Tipo,Pago,Estado,Total\n`;
  calDiaPedidos.forEach(p=>{
    const hora=p.creado_en_local.split(',')[1]?.trim().substring(0,5)||'';
    csv+=`#${p.id.slice(-6).toUpperCase()},${hora},${p.tipo},${p.pago},${p.estado},$${Math.round(p.total)}\n`;
  });
  csv+=`\nTOTAL VENTAS,,,,,${Math.round(res.ventas)}\n`;
  csv+=`GASTOS DEL DÍA,,,,,${Math.round(res.gastos)}\n`;
  csv+=`GANANCIA NETA,,,,,${Math.round(ganancia)}\n`;
  csv+=`NÚMERO DE PEDIDOS,,,,,${calDiaPedidos.length}\n`;
  descargarCSV(csv,`${nombreArchivo}_ventas.csv`);

  // CSV 2 — Productos del día
  const ids=calDiaPedidos.map(p=>p.id);
  if(ids.length){
    const{data:items}=await sb.from('pedido_items')
      .select('*, productos!pedido_items_producto_id_fkey(nombre)')
      .in('pedido_id',ids);
    const conteo={};
    (items||[]).forEach(i=>{
      const n=i.productos?.nombre||'Desconocido';
      if(!conteo[n])conteo[n]={cantidad:0,total:0};
      conteo[n].cantidad+=i.cantidad;
      conteo[n].total+=Number(i.subtotal);
    });
    let csv2=`PRODUCTOS · ${fechaLabel}\n\nProducto,Unidades,Total\n`;
    Object.entries(conteo).sort((a,b)=>b[1].cantidad-a[1].cantidad).forEach(([n,d])=>{
      csv2+=`${n},${d.cantidad},$${Math.round(d.total)}\n`;
    });
    descargarCSV(csv2,`${nombreArchivo}_productos.csv`);
  }
  mostrarNotifToast('⬇ Reporte descargado',fechaLabel);
}
async function cambiarEstado(id,estado){
  await sb.from('pedidos').update({estado}).eq('id',id);
  const idx=pedidos.findIndex(p=>p.id===id);
  if(idx>=0){pedidos[idx].estado=estado; pedidos[idx]._esNuevo=false;}
  renderTodo();
}
function toggleCard(id){
  document.getElementById('body-'+id)?.classList.toggle('abierto');
}
function cambiarTab(tab,btn){
  tabActual=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('activo'));
  btn.classList.add('activo');
  document.getElementById('vista-lista').classList.toggle('activa',tab==='lista');
  document.getElementById('vista-calendario').classList.toggle('activa',tab==='calendario');
  if(tab==='calendario') iniciarCalendario();
  if(tab==='lista') renderTodo();
}
function labelEstado(e){return {'recibido':'Recibido','preparando':'Preparando','en_camino':'En camino','listo':'Listo','entregado':'Entregado','cancelado':'Cancelado'}[e]||e;}
function formatHora(p){
  if(p.creado_en_local)return p.creado_en_local.split(' ')[1]?.substring(0,5)||p.creado_en_local;
  if(!p.creado_en)return '';
  return new Date(p.creado_en).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}

// ─── REPORTE EXCEL ────────────────────────────────────────────
function descargarCSV(contenido,nombre){
  const blob=new Blob(['\uFEFF'+contenido],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=nombre; a.click();
  URL.revokeObjectURL(url);
}
async function generarReportes(){
  const hoyMex=new Date().toLocaleDateString('es-MX',{timeZone:'America/Mexico_City'});
  const fecha=hoyMex.replace(/\//g,'-');

  const{data:todosPedidos}=await sb.from('pedidos')
    .select('*, clientes(telefono)')
    .not('creado_en_local','is',null)
    .neq('estado','cancelado')
    .order('creado_en_local',{ascending:true});

  const pedidosHoy=(todosPedidos||[]).filter(p=>{
    const fp=p.creado_en_local.split(',')[0].trim();
    return fp===hoyMex;
  });

  // Cargar gasto del día
  let gastoDia=0;
  try{
    const{data:g}=await sb.from('gastos_diarios').select('importe').eq('fecha',fechaHoyMex()).single();
    if(g)gastoDia=Number(g.importe);
  }catch(e){}

  const totalVentas=pedidosHoy.reduce((s,p)=>s+Number(p.total),0);
  const gananciaNet=totalVentas-gastoDia;

  // CSV 1 — Reporte de ventas y ganancias
  let csv='REPORTE DE VENTAS · '+hoyMex+'\n\n';
  csv+='#Pedido,Hora,Pago,Estado,Total\n';
  for(const p of pedidosHoy){
    csv+=`#${p.id.slice(-6).toUpperCase()},${formatHora(p)},${p.pago},${p.estado},$${Math.round(p.total)}\n`;
  }
  csv+='\n';
  csv+=`TOTAL VENTAS,,,,$${Math.round(totalVentas)}\n`;
  csv+=`GASTOS DEL DÍA,,,,$${Math.round(gastoDia)}\n`;
  csv+=`GANANCIA NETA,,,,$${Math.round(gananciaNet)}\n`;
  csv+=`NÚMERO DE PEDIDOS,,,,${pedidosHoy.length}\n`;
  descargarCSV(csv,`reporte_ventas_${fecha}.csv`);

  // CSV 2 — Productos más vendidos
  const ids=pedidosHoy.map(p=>p.id);
  if(ids.length){
    const{data:items}=await sb.from('pedido_items').select('*, productos!pedido_items_producto_id_fkey(nombre)').in('pedido_id',ids);
    const conteo={};
    for(const item of items||[]){
      const n=item.productos?.nombre||'Desconocido';
      if(!conteo[n])conteo[n]={cantidad:0,total:0};
      conteo[n].cantidad+=item.cantidad;
      conteo[n].total+=Number(item.subtotal);
    }
    let csv2='Producto,Unidades Vendidas,Total Generado\n';
    Object.entries(conteo).sort((a,b)=>b[1].cantidad-a[1].cantidad).forEach(([n,d])=>{
      csv2+=`${n},${d.cantidad},$${Math.round(d.total)}\n`;
    });
    descargarCSV(csv2,`reporte_productos_${fecha}.csv`);
  }

  mostrarNotifToast('📊 Reportes generados','Revisa tus descargas');
}
function programarReporte(){
  const ahora=new Date(),objetivo=new Date();
  objetivo.setHours(22,0,0,0);
  if(ahora>=objetivo)objetivo.setDate(objetivo.getDate()+1);
  setTimeout(()=>{ generarReportes(); setInterval(generarReportes,24*60*60*1000); },objetivo-ahora);
}
</script>
